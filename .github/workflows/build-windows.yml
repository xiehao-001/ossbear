name: Windows 安装包

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 Electron 依赖
        working-directory: desktop
        shell: pwsh
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Warning "npm install 第 $i 次失败，准备重试"
            Start-Sleep -Seconds (5 * $i)
          }
          if (-not $ok) { throw "npm install 连续失败，请检查 npm registry 与网络。" }

      - name: 构建安装包
        shell: cmd
        env:
          DEBUG: electron-builder
        run: call build-release.bat

      - name: 计算校验值
        shell: pwsh
        run: |
          $f = Get-ChildItem desktop/release/StorageBear-Setup-*.exe | Select-Object -First 1
          "SHA256  $($f.Name)  $((Get-FileHash $f.FullName -Algorithm SHA256).Hash)" |
            Out-File -Encoding ascii desktop/release/SHA256.txt
          Get-Content desktop/release/SHA256.txt
          if (-not (Test-Path desktop/release/latest.yml)) {
            throw "未生成 latest.yml，自动更新不可用。请检查 desktop/package.json 的 build.publish 配置。"
          }

      - name: 发布公开构建产物
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          $exe = Get-ChildItem desktop/release/StorageBear-Setup-*.exe | Select-Object -First 1
          if (-not $exe) { throw "未找到安装包。" }
          $files = @($exe.FullName, (Resolve-Path 'desktop/release/latest.yml').Path)
          Get-ChildItem desktop/release/*.blockmap -ErrorAction SilentlyContinue | ForEach-Object { $files += $_.FullName }
          if (Test-Path 'desktop/release/SHA256.txt') { $files += (Resolve-Path 'desktop/release/SHA256.txt').Path }
          $sha = (Get-Content 'desktop/release/SHA256.txt' -Raw).Trim()
          $notes = @"
          Windows 安装包 $env:TAG
          自动更新源：http://www.ai-xiehao.me/updates/
          $sha
          "@
          gh release view $env:TAG --repo $env:REPO 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --repo $env:REPO --title "存储熊 $env:TAG" --notes $notes
          }
          gh release upload $env:TAG @files --repo $env:REPO --clobber
          if ($LASTEXITCODE -ne 0) { throw "上传公开 Release 失败。" }

      - name: 保留当前次版本最新 3 个 Release
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if ($env:TAG -notmatch '^v(\d+)\.(\d+)\.') { exit 0 }
          $prefix = "v$($matches[1]).$($matches[2])."
          $all = gh release list --repo $env:REPO --limit 100 --json tagName,createdAt | ConvertFrom-Json
          $cur = @($all | Where-Object { $_.tagName -like "$prefix*" } | Sort-Object { try { [version]($_.tagName.TrimStart('v')) } catch { [version]'0.0.0' } } -Descending)
          $cur | Select-Object -Skip 3 | ForEach-Object {
            Write-Host "删除过期 Release（保留 Git 标签）：$($_.tagName)"
            gh release delete $_.tagName --repo $env:REPO --yes
          }

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: StorageBear-Setup-${{ github.ref_name }}
          path: |
            desktop/release/StorageBear-Setup-*.exe
            desktop/release/latest.yml
            desktop/release/*.blockmap
            desktop/release/SHA256.txt
          if-no-files-found: error
          retention-days: 14
