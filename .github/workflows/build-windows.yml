name: Windows 安装包

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 Electron 依赖
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: 构建安装包
        shell: cmd
        env:
          DEBUG: electron-builder
        run: call build-release.bat

      - name: 计算校验值
        shell: pwsh
        run: |
          $f = Get-ChildItem desktop/release/StorageBear-Setup-*.exe | Select-Object -First 1
          "SHA256  $($f.Name)  $((Get-FileHash $f.FullName -Algorithm SHA256).Hash)" |
            Out-File -Encoding ascii desktop/release/SHA256.txt
          Get-Content desktop/release/SHA256.txt
          if (-not (Test-Path desktop/release/latest.yml)) {
            throw "未生成 latest.yml，自动更新不可用。请检查 desktop/package.json 的 build.publish 配置。"
          }

      - name: 发布到更新仓库
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $repo = 'xiehao-001/ossbear-releases'
          if (-not $env:GH_TOKEN) {
            Write-Warning "未配置 RELEASES_TOKEN，跳过 GitHub Releases 发布；安装包仍作为构建产物上传。"
            exit 0
          }
          $exe = Get-ChildItem desktop/release/StorageBear-Setup-*.exe | Select-Object -First 1
          if (-not $exe) { throw "未找到安装包。" }
          $files = @($exe.FullName, (Resolve-Path 'desktop/release/latest.yml').Path)
          Get-ChildItem desktop/release/*.blockmap -ErrorAction SilentlyContinue | ForEach-Object { $files += $_.FullName }
          if (Test-Path desktop/release/SHA256.txt) { $files += (Resolve-Path 'desktop/release/SHA256.txt').Path }
          gh release view $env:TAG --repo $repo 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --repo $repo --title "存储熊 $env:TAG" --notes "Windows 安装包与自动更新元数据。下载并安装 StorageBear-Setup-*.exe；已安装较新版本的客户端会自动检查更新。"
          }
          gh release upload $env:TAG @files --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw "上传 GitHub Release 失败。" }
          Write-Host "已发布：https://github.com/$repo/releases/tag/$env:TAG"

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: StorageBear-Setup-${{ github.ref_name }}
          path: |
            desktop/release/StorageBear-Setup-*.exe
            desktop/release/SHA256.txt
          if-no-files-found: error
          retention-days: 14
